name: Build on PR

on:
    workflow_dispatch:
    push:
        branches:
            - feature/admin-dashboard
            - feature/ci-cd
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20"

            - name: Install Dependencies
              run: npm install

            - name: Build Project
              run: npm run build
